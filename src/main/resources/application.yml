spring:
  main:
    web-application-type: none   # stdio: no hay servidor HTTP
    banner-mode: off             # stdout es EXCLUSIVAMENTE el canal del protocolo MCP
  output:
    ansi:
      enabled: never
  ai:
    mcp:
      server:
        name: donatrack
        version: 1.0.0
        stdio: true              # VERIFICAR contra la doc de Spring AI 2.0.0 (ver README)

app:
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
    health-path: ${HEALTH_PATH:/actuator/health}
    prefijos:                    # deben coincidir con las rutas del gateway (que quita el prefijo antes de reenviar)
      logistica: ${PREFIJO_LOGISTICA:/logistica}
      donaciones: ${PREFIJO_DONACIONES:/donaciones}
      incentivos: ${PREFIJO_INCENTIVOS:/incentivos}
      donadores-entidades: ${PREFIJO_DONADORES_ENTIDADES:/donadores-entidades}
      consultas: ${PREFIJO_CONSULTAS:/consultas}
  http:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:10s}
    read-timeout: ${HTTP_READ_TIMEOUT:60s}   # Render free: cold start de 30-60s
    max-response-chars: ${MAX_RESPONSE_CHARS:20000}   # corta listados enormes para no inundar el contexto de Claude
